# GPU training env for Linux (e.g. ParamShakti V100), conda-forge only.
#   conda env create -f bdx_mjx/environment.yml
#   conda activate bdx
#   python -c "import jax; print(jax.devices())"   # on a GPU node: CudaDevice
#
# jax < 0.10: brax calls jax.device_put_replicated, removed in jax 0.10.
# jaxlib *cuda12*: CUDA 13 builds do not support the V100 (sm_70).
# playground is NOT needed (the two pieces used are vendored in bdx_mjx/).
name: bdx
channels:
  - conda-forge
dependencies:
  - python=3.11
  - jax<0.10
  - jaxlib<0.10=*cuda12*
  - cuda-version=12.*
  - flax=0.12.6
  - optax
  - brax=0.12.5
  - mujoco=3.14.0
  - mujoco-mjx=3.14.0
  - orbax-checkpoint
  - ml-collections
  - matplotlib
  - pillow
  - ffmpeg
  - mediapy
